services:
  php:
    build:
      target: development
      args:
        USER_ID: ${SPIN_USER_ID}
        GROUP_ID: ${SPIN_GROUP_ID}
    volumes:
      - .:/var/www/html/
    networks:
      - lifeos
      - spin-proxy
    extra_hosts:
      # Let PHP reach its own public hostname through the shared proxy on the host
      - "lifeos.test:host-gateway"
    depends_on:
      mysql:
        condition: service_healthy
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=spin-proxy"
      - "traefik.http.routers.lifeos-web.rule=HostRegexp(`lifeos.test`)"
      - "traefik.http.routers.lifeos-web.entrypoints=websecure"
      - "traefik.http.routers.lifeos-web.tls=true"
      - "traefik.http.services.lifeos-web.loadbalancer.server.port=8080"
      - "traefik.http.services.lifeos-web.loadbalancer.server.scheme=http"

  node:
    image: node:22
    volumes:
      - .:/usr/src/app/
    working_dir: /usr/src/app/
    networks:
      - lifeos

  mailpit:
      image: axllent/mailpit
      networks:
        - lifeos
      ports:
        - "${MAILPIT_FORWARD_PORT:-45302}:8025"

  mysql:
    networks:
      - lifeos
    volumes:
      - mysql_data:/var/lib/mysql
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-root}
      MYSQL_DATABASE: ${DB_DATABASE:-lifeos}
      MYSQL_USER: ${DB_USERNAME:-lifeos}
      MYSQL_PASSWORD: ${DB_PASSWORD:-lifeos}
    ports:
      - "${DB_FORWARD_PORT:-45300}:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u$$MYSQL_USER", "-p$$MYSQL_PASSWORD"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    command: "redis-server --appendonly yes"
    volumes:
      - redis_data:/data
    ports:
      - "${REDIS_FORWARD_PORT:-45301}:6379"
    networks:
      - lifeos


  minio:
    ports:
      - '${MINIO_FORWARD_PORT:-45303}:9000'
      - '${MINIO_CONSOLE_FORWARD_PORT:-45304}:8900'
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USERNAME:-lifeos}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-lifeos}
    volumes:
      - minio_data:/data/minio
    networks:
      - lifeos
    command: 'minio server /data/minio --console-address ":8900"'

  queue:
    build:
      target: development-cli
      args:
        USER_ID: ${SPIN_USER_ID}
        GROUP_ID: ${SPIN_GROUP_ID}
    volumes:
      - .:/var/www/html/
    networks:
      - lifeos
    extra_hosts:
      - "lifeos.test:host-gateway"
    depends_on:
      mysql:
        condition: service_healthy
    command: "php artisan horizon"

  scheduler:
    build:
      target: development-cli
      args:
        USER_ID: ${SPIN_USER_ID}
        GROUP_ID: ${SPIN_GROUP_ID}
    volumes:
      - .:/var/www/html/
    networks:
      - lifeos
    extra_hosts:
      - "lifeos.test:host-gateway"
    depends_on:
      mysql:
        condition: service_healthy
    command: "php artisan schedule:work"

networks:
  lifeos:
  spin-proxy:
    external: true

volumes:
  mysql_data:
  redis_data:
  minio_data:
